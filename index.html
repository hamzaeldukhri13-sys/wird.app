<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وِرْد</title>
    
    <!-- PWA Meta Tags & Manifest Link -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a1a">
    <meta name="background-color" content="#ffffff">
    <meta name="description" content="تطبيق وِرْد - منصة متكاملة للقراءة والبحث والوسائط">
    
    <!-- Apple Touch Icons & Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="وِرْد">
    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --accent-color: #0066cc;
            --card-bg: #f9f9f9;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --accent-color: #4dabf7;
            --card-bg: #1e1e1e;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background 0.3s, color 0.3s;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-bg);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
        }

        button:hover {
            opacity: 0.9;
        }

        .search-box {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: var(--card-bg);
            color: var(--text-color);
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        .content-card {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <header>
        <h1>وِرْد</h1>
        <button id="themeToggle" onclick="toggleTheme()">تغيير النمط</button>
    </header>

    <main>
        <input type="text" class="search-box" id="searchInput" placeholder="ابحث في المحتوى..." oninput="handleSearch()">
        
        <div class="content-card">
            <h3>مرحباً بك في تطبيق وِرْد</h3>
            <p>هذا التطبيق مصمم ليعمل بكفاءة عالية كتطبيق ويب تقدمي (PWA) قابل للتثبيت.</p>
        </div>
    </main>

    <script>
        // تبديل المظاهر (Dark / Light)
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        // استرجاع النمط المحفوظ
        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            registerServiceWorker();
        });

        function handleSearch() {
            const query = document.getElementById('searchInput').value;
            // منطق البحث هنا
        }

        // تسجيل Service Worker لضمان اجتياز اختبارات PWABuilder بنجاح تام
        function registerServiceWorker() {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js')
                .then(() => console.log('Service Worker Registered Successfully'))
                .catch((error) => console.log('Service Worker Registration Failed:', error));
            }
        }
    </script>
</body>
</html>
