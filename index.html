<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق وِرْد - التسميع الذكي</title>
    
    <!-- ربط ملف الـ Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0066cc">
    <meta name="description" content="تطبيق وِرْد للتسميع الذكي والتعليم">
    
    <!-- إعدادات الجوال -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            color: #0066cc;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 20px;
        }

        .mic-btn {
            background-color: #0066cc;
            color: white;
            border: none;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            box-shadow: 0 4px 10px rgba(0, 102, 204, 0.3);
        }

        .mic-btn.recording {
            background-color: #dc3545;
            animation: pulse 1.5s infinite;
            box-shadow: 0 4px 15px rgba(220, 53, 69, 0.5);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .output-box {
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            min-height: 100px;
            max-height: 200px;
            overflow-y: auto;
            text-align: right;
            font-size: 1.1rem;
            color: #333;
            margin-top: 15px;
            word-break: break-word;
        }

        .status-text {
            font-size: 0.9rem;
            color: #888;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>وِرْد - التسميع الذكي</h1>
        <p>اضغط على الميكروفون وابدأ بالتسميع بصوت واضح</p>
        
        <!-- زر الميكروفون للتسميع -->
        <button id="micBtn" class="mic-btn" onclick="toggleListening()">
            🎤
        </button>
        
        <div id="statusText" class="status-text">اضغط للبدء...</div>
        
        <!-- صندوق عرض ما تم تسميعه -->
        <div id="outputBox" class="output-box">النص المسموع سيظهر هنا لحظياً...</div>
    </div>

    <script>
        let recognition;
        let isRecording = false;

        // التحقق من دعم المتصفح لميزة التعرف على الصوت
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            
            recognition.lang = 'ar-SA'; // اللغة العربية (الفصحى / السعودية)
            recognition.continuous = true; // استمرار الاستماع حتى يتم الإيقاف يدوياً
            recognition.interimResults = true; // إظهار الكلمات أثناء النطق فوراً

            recognition.onstart = function() {
                isRecording = true;
                document.getElementById('micBtn').classList.add('recording');
                document.getElementById('statusText').innerText = 'جاري الاستماع والتسميع... تحدث الآن';
            };

            recognition.onresult = function(event) {
                let interimTranscript = '';
                let finalTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }

                // عرض النص في الصندوق
                const outputBox = document.getElementById('outputBox');
                if (finalTranscript !== '') {
                    outputBox.innerText = finalTranscript;
                    // هنا يمكنك مقارنة النص المسموع بالنص الأصلي المطلوب في التطبيق
                } else if (interimTranscript !== '') {
                    outputBox.innerText = interimTranscript;
                }
            };

            recognition.onerror = function(event) {
                console.error('خطأ في التعرف على الصوت:', event.error);
                document.getElementById('statusText').innerText = 'حدث خطأ، حاول مرة أخرى.';
                stopListening();
            };

            recognition.onend = function() {
                stopListening();
            };
        } else {
            alert('عذراً، متصفحك لا يدعم ميزة التسميع الصوتي المباشر.');
        }

        function toggleListening() {
            if (!recognition) {
                alert('الميزة غير مدعومة في هذا الجهاز.');
                return;
            }

            if (isRecording) {
                recognition.stop();
            } else {
                document.getElementById('outputBox').innerText = '';
                recognition.start();
            }
        }

        function stopListening() {
            isRecording = false;
            document.getElementById('micBtn').classList.remove('recording');
            document.getElementById('statusText').innerText = 'انتهى التسميع. اضغط للبدء مجدداً';
        }

        // تسجيل Service Worker لضمان التوافق مع PWABuilder
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registered!'))
                    .catch(err => console.log('Service Worker registration failed: ', err));
            });
        }
    </script>
</body>
</html>
