<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  
  <!-- عنوان التطبيق -->
  <title>تطبيق القرآن الكريم | التسميع الذكي</title>
  <meta name="description" content="تطبيق القرآن الكريم للتلاوة والتسميع الخفي الذكي مع متابعة الحفظ والأنشطة اليومية." />

  <!-- PWA & Theme Meta Tags for PWABuilder & Mobile Stores -->
  <meta name="theme-color" content="#0d9488" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="المصحف الذكي" />
  <meta name="application-name" content="المصحف الذكي" />

  <!-- App Icons -->
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icon-192.png" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Google Fonts: الخطوط العربية والقرآنية -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;700;800&family=Scheherazade+New:wght@400;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
            },
            quranPaper: '#fbf8f1',
            quranPaperDark: '#121824',
          },
          fontFamily: {
            quran: ['"Scheherazade New"', '"Amiri"', 'serif'],
            sans: ['Cairo', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- أنماط مخصصة للتسميع والتمويه (Blur/Fade Effects) -->
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    
    .font-quran {
      font-family: 'Scheherazade New', 'Amiri', serif;
      word-spacing: 2px;
      line-height: 2.3;
    }

    /* تأثير تمويه الآيات أثناء التسميع الخفي */
    .verse-hidden {
      filter: blur(8px);
      opacity: 0.35;
      transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      background-color: rgba(229, 231, 235, 0.5);
      border-radius: 6px;
      padding: 0 8px;
    }

    .dark .verse-hidden {
      background-color: rgba(55, 65, 81, 0.5);
      filter: blur(9px);
      opacity: 0.25;
    }

    /* تأثير ظهور الآية عند القراءة الصحيحة */
    .verse-revealed {
      filter: blur(0px);
      opacity: 1;
      transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      animation: highlightReveal 1.2s ease-out;
    }

    @keyframes highlightReveal {
      0% {
        background-color: rgba(16, 185, 129, 0.3);
        transform: scale(1.02);
      }
      100% {
        background-color: transparent;
        transform: scale(1);
      }
    }
  </style>
</head>

<body class="h-full bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 antialiased selection:bg-brand-500 selection:text-white">
  
  <!-- Root React App Container -->
  <div id="root" class="min-h-full flex flex-col"></div>

  <!-- Entry Script for React/Vite -->
  <script type="module" src="/src/main.jsx"></script>

  <!-- تسجيل الـ Service Worker لمتطلبات PWABuilder والعمل بدون إنترنت -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((reg) => {
            console.log('PWA Service Worker registered successfully:', reg.scope);
          })
          .catch((err) => {
            console.warn('PWA Service Worker registration failed:', err);
          });
      });
    }
  </script>
</body>
</html>
